<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitoza - Precyzyjna Wersja</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #000;
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
  }
  
  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: 1;
  }
  
  canvas { display: block; }
  
  .scroll-spacer { height: 600vh; position: relative; z-index: 0; }
  
  .section {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  
  .section.active { opacity: 1; }
  
  .section h1 {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 200;
    letter-spacing: -0.02em;
    text-align: center;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
  }
  
  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, #fff, #aaa);
    z-index: 100;
    transition: width 0.1s;
  }
  
  #scroll-hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 13px;
    opacity: 0.5;
    animation: pulse 2s infinite;
    pointer-events: none;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translateX(-50%) translateY(0); }
    50% { opacity: 0.8; transform: translateX(-50%) translateY(-5px); }
  }
  
  .phase-label {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 11px;
    opacity: 0.4;
    z-index: 10;
    font-family: monospace;
    pointer-events: none;
  }
  
  .logo-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #aaa;
    font-size: 12px;
    text-align: center;
    pointer-events: none;
    opacity: 0.7;
    z-index: 100;
    background: rgba(0,0,0,0.7);
    padding: 10px 20px;
    border-radius: 10px;
    max-width: 80%;
  }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="canvas-container"></div>

<div class="section" id="sec-0">
  <div class="section-content">
    <h1>Jeden kształt.<br>Jedna wizja.</h1>
  </div>
</div>

<div class="section" id="sec-1">
  <div class="section-content">
    <h1>Podział.<br>Ewolucja formy.</h1>
  </div>
</div>

<div class="section" id="sec-2">
  <div class="section-content">
    <h1>Dwa światy.<br>Jedna historia.</h1>
  </div>
</div>

<div class="scroll-spacer"></div>

<div id="scroll-hint">↓ Scrolluj żeby zobaczyć efekt</div>
<div class="phase-label" id="phase-label">phase: idle</div>
<div class="logo-hint">C na górze | G na lewej<br>Przykładowe logo - wersja finalna będzie z Twoim logiem</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ═══════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 7;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.5, 0.4, 0.85
);
composer.addPass(bloom);

// ═══════════════════════════════════════════
// SHADERS - PRECYSYJNA WERSJA
// ═══════════════════════════════════════════
const vertexShader = `
  uniform float uProgress;
  uniform float uTime;
  uniform float uSide;
  uniform float uBubbliness;
  
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  varying float vFresnel;
  varying vec2 vUv;
  varying float vDisplacement;
  varying vec3 vFace;
  
  vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
  vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
  
  float snoise(vec3 v){
    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i = floor(v + dot(v, C.yyy));
    vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy);
    vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C.xxx;
    vec3 x2 = x0 - i2 + C.yyy;
    vec3 x3 = x0 - D.yyy;
    i = mod(i, 289.0);
    vec4 p = permute(permute(permute(
      i.z + vec4(0.0, i1.z, i2.z, 1.0))
      + i.y + vec4(0.0, i1.y, i2.y, 1.0))
      + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 1.0/7.0;
    vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z);
    vec4 y_ = floor(j - 7.0 * x_);
    vec4 hx = x_ * ns.x + ns.yyyy;
    vec4 hy = y_ * ns.x + ns.yyyy;
    vec4 h = 1.0 - abs(hx) - abs(hy);
    vec4 b0 = vec4(hx.xy, hy.xy);
    vec4 b1 = vec4(hx.zw, hy.zw);
    vec4 s0 = floor(b0)*2.0 + 1.0;
    vec4 s1 = floor(b1)*2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
    vec3 p0 = vec3(a0.xy, h.x);
    vec3 p1 = vec3(a0.zw, h.y);
    vec3 p2 = vec3(a1.xy, h.z);
    vec3 p3 = vec3(a1.zw, h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
    m = m * m;
    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
  }
  
  vec3 sdfBox(vec3 p, float size) {
    vec3 dir = normalize(p + 0.0001);
    float boxR = size / max(abs(dir.x), max(abs(dir.y), abs(dir.z)));
    return dir * boxR;
  }
  
  void main() {
    vUv = uv;
    vec3 pos = position;
    float totalDisp = 0.0;
    
    // FAZA 1: Sfera → Sześcian
    float toBox = smoothstep(0.0, 0.1, uProgress);
    vec3 boxPos = sdfBox(normalize(pos), 1.0);
    pos = mix(pos, boxPos, toBox);
    
    // FAZA 2: Bubbly - wielowarstwowy noise
    float bubblePhase = smoothstep(0.1, 0.3, uProgress) * (1.0 - smoothstep(0.5, 0.7, uProgress));
    
    float noise1 = snoise(pos * 2.0 + uTime * 0.3) * uBubbliness * bubblePhase;
    float noise2 = snoise(pos * 4.0 - uTime * 0.2) * uBubbliness * 0.5 * bubblePhase;
    float noise3 = snoise(pos * 8.0 + uTime * 0.15) * uBubbliness * 0.25 * bubblePhase;
    
    float totalNoise = noise1 + noise2 + noise3;
    pos += normal * totalNoise * 0.3;
    totalDisp = totalNoise * 0.3;
    
    float pulse = sin(uTime * 2.0 + length(pos) * 3.0) * 0.02 * bubblePhase;
    pos += normal * pulse;
    
    // FAZA 3: Mitoza - ZWIĘKSZONY ZAKRES
    float splitPhase = smoothstep(0.25, 0.65, uProgress);
    pos.x *= 1.0 + splitPhase * 1.8;
    
    float pinchStrength = splitPhase * (1.0 - smoothstep(0.5, 0.75, uProgress));
    float centerDist = 1.0 - smoothstep(0.0, 0.5, abs(pos.x));
    pos.y *= 1.0 - centerDist * pinchStrength * 0.6;
    pos.z *= 1.0 - centerDist * pinchStrength * 0.6;
    
    pos.x += splitPhase * uSide * 3.0; // ZWIĘKSZONY ROZDZIEL
    pos.y *= 1.0 - splitPhase * 0.1;
    
    // FAZA 4: Morph do płaskiego kwadratu - PRECYSYJNY
    float squarePhase = smoothstep(0.6, 0.85, uProgress);
    
    // Spłaszczenie w Z - PEŁNE
    pos.z *= (1.0 - squarePhase);
    
    // Zaokrąglone krawędzie → ostre
    float cornerRadius = mix(0.3, 0.0, squarePhase);
    vec2 xy = pos.xy;
    vec2 d = abs(xy) - vec2(0.9 - cornerRadius);
    float roundedDist = length(max(d, 0.0)) - cornerRadius;
    vec2 squareTarget = normalize(xy + 0.001) * (0.9 + roundedDist * 0.1);
    
    pos.xy = mix(pos.xy, squareTarget, squarePhase);
    
    // FAZA 5: Powiększenie - ZWIĘKSZONY
    float growPhase = smoothstep(0.7, 1.0, uProgress);
    float scale = 1.0 + growPhase * 1.5;
    pos *= scale;
    
    // DODANE: identyfikacja ścian
    vec3 worldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
    vFace = vec3(
      max(0.0, worldNormal.y),
      max(0.0, -worldNormal.x),
      max(0.0, worldNormal.x)
    );
    
    vNormal = normalMatrix * normal;
    vWorldPos = (modelMatrix * vec4(pos, 1.0)).xyz;
    vDisplacement = totalDisp;
    
    vec3 viewDir = normalize(cameraPosition - vWorldPos);
    vFresnel = pow(1.0 - max(dot(worldNormal, viewDir), 0.0), 2.0);
    
    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
  }
`;

const fragmentShader = `
  uniform float uProgress;
  uniform float uTime;
  uniform float uSide;
  uniform float uOpacity;
  
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  varying float vFresnel;
  varying vec2 vUv;
  varying float vDisplacement;
  varying vec3 vFace;
  
  void main() {
    vec3 n = normalize(vNormal);
    
    // BIAŁY MLECZNY KOLOR
    vec3 white = vec3(1.0, 1.0, 1.0);
    vec3 offWhite = vec3(0.95, 0.95, 0.97);
    vec3 shadow = vec3(0.7, 0.7, 0.75);
    
    // Oświetlenie
    vec3 lightDir1 = normalize(vec3(2.0, 3.0, 4.0));
    vec3 lightDir2 = normalize(vec3(-2.0, -1.0, 3.0));
    vec3 lightDir3 = normalize(vec3(0.0, -2.0, -2.0));
    
    float diff1 = max(dot(n, lightDir1), 0.0);
    float diff2 = max(dot(n, lightDir2), 0.0) * 0.5;
    float diff3 = max(dot(n, lightDir3), 0.0) * 0.3;
    
    // Subsurface scattering
    float sss = pow(max(dot(n, normalize(lightDir1 + vec3(0.0, 0.0, -1.0))), 0.0), 2.0) * 0.3;
    
    vec3 color = offWhite * (0.3 + diff1 * 0.5 + diff2 * 0.3 + diff3 * 0.2);
    color += white * sss;
    
    // Fresnel rim
    color += white * vFresnel * 0.4;
    
    // Cień w zagłębieniach
    color += shadow * vDisplacement * 0.5;
    
    // Specular highlight
    vec3 viewDir = normalize(cameraPosition - vWorldPos);
    vec3 halfDir = normalize(lightDir1 + viewDir);
    float spec = pow(max(dot(n, halfDir), 0.0), 32.0);
    color += white * spec * 0.6;
    
    // Drugi specular
    vec3 halfDir2 = normalize(lightDir2 + viewDir);
    float spec2 = pow(max(dot(n, halfDir2), 0.0), 16.0);
    color += offWhite * spec2 * 0.3;
    
    // LOGO NA ŚCIANACH
    float squarePhase = smoothstep(0.6, 0.85, uProgress);
    if (squarePhase > 0.0) {
      // Top face - litera C
      if (vFace.x > 0.9) {
        vec2 uv = vUv * 1.5 - 0.5;
        float cShape = 0.0;
        
        // Procedural C
        float radius = 0.3;
        float dist = length(uv) - radius;
        cShape = smoothstep(0.03, 0.0, dist);
        cShape *= 1.0 - smoothstep(0.0, 0.05, uv.x + radius);
        
        // Ramka
        float border = smoothstep(0.85, 0.9, length(uv));
        color = mix(color, shadow * 0.7, border);
        
        color = mix(color, white * 0.95, cShape);
      }
      
      // Left face - litera G
      if (vFace.y > 0.9) {
        vec2 uv = vUv * 1.5 - 0.5;
        float gShape = 0.0;
        
        // Procedural G
        float radius = 0.3;
        float dist = length(uv) - radius;
        gShape = smoothstep(0.03, 0.0, dist);
        gShape *= 1.0 - smoothstep(0.0, 0.05, uv.x + radius);
        gShape *= 1.0 - smoothstep(0.0, 0.05, uv.y - 0.1);
        
        // Ramka
        float border = smoothstep(0.85, 0.9, length(uv));
        color = mix(color, shadow * 0.7, border);
        
        color = mix(color, white * 0.95, gShape);
      }
    }
    
    float alpha = uOpacity * (0.9 + vFresnel * 0.1);
    
    gl_FragColor = vec4(color, alpha);
  }
`;

// ═══════════════════════════════════════════
// CZĄSTECZKI / KROPLE (splash effect)
// ══════════════════════════════════════════
const dropVertexShader = `
  uniform float uProgress;
  uniform float uTime;
  attribute float aSize;
  attribute float aSpeed;
  attribute float aOffset;
  varying float vAlpha;
  
  void main() {
    vec3 pos = position;
    
    float active = smoothstep(0.25, 0.35, uProgress) * (1.0 - smoothstep(0.5, 0.6, uProgress));
    
    float time = uTime * aSpeed + aOffset;
    pos += normalize(pos) * sin(time) * 0.5 * active;
    pos.y -= active * 0.3 * sin(time * 0.5);
    
    vAlpha = active * smoothstep(0.0, 0.1, uProgress - 0.25) * smoothstep(0.0, 0.1, 0.6 - uProgress);
    
    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = aSize * (300.0 / -mvPosition.z) * vAlpha;
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const dropFragmentShader = `
  varying float vAlpha;
  
  void main() {
    float dist = length(gl_PointCoord - vec2(0.5));
    if (dist > 0.5) discard;
    
    float alpha = smoothstep(0.5, 0.2, dist) * vAlpha;
    
    gl_FragColor = vec4(1.0, 1.0, 1.0, alpha * 0.8);
  }
`;

// ═══════════════════════════════════════════
// GEOMETRY & MESHES
// ═══════════════════════════════════════════
const sphereGeo = new THREE.SphereGeometry(1, 64, 64);

function createMaterial(side) {
  return new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: {
      uProgress: { value: 0 },
      uTime: { value: 0 },
      uSide: { value: side },
      uBubbliness: { value: 1.0 },
      uOpacity: { value: 1.0 }
    },
    transparent: true,
    side: THREE.DoubleSide
  });
}

// Core (single cube)
const coreMat = createMaterial(0);
const coreMesh = new THREE.Mesh(sphereGeo, coreMat);
scene.add(coreMesh);

// Left & Right (split)
const leftMat = createMaterial(-1);
const leftMesh = new THREE.Mesh(sphereGeo, leftMat);
leftMesh.visible = false;
scene.add(leftMesh);

const rightMat = createMaterial(1);
const rightMesh = new THREE.Mesh(sphereGeo, rightMat);
rightMesh.visible = false;
scene.add(rightMesh);

// Cząsteczki (drops)
const dropCount = 250;
const dropGeo = new THREE.BufferGeometry();
const dropPositions = new Float32Array(dropCount * 3);
const dropSizes = new Float32Array(dropCount);
const dropSpeeds = new Float32Array(dropCount);
const dropOffsets = new Float32Array(dropCount);

for (let i = 0; i < dropCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 2 - 1);
  const r = 1.2 + Math.random() * 0.5;
  
  dropPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  dropPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  dropPositions[i * 3 + 2] = r * Math.cos(phi);
  
  dropSizes[i] = Math.random() * 3 + 1;
  dropSpeeds[i] = Math.random() * 2 + 1;
  dropOffsets[i] = Math.random() * Math.PI * 2;
}

dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPositions, 3));
dropGeo.setAttribute('aSize', new THREE.BufferAttribute(dropSizes, 1));
dropGeo.setAttribute('aSpeed', new THREE.BufferAttribute(dropSpeeds, 1));
dropGeo.setAttribute('aOffset', new THREE.BufferAttribute(dropOffsets, 1));

const dropMat = new THREE.ShaderMaterial({
  vertexShader: dropVertexShader,
  fragmentShader: dropFragmentShader,
  uniforms: {
    uProgress: { value: 0 },
    uTime: { value: 0 }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const drops = new THREE.Points(dropGeo, dropMat);
scene.add(drops);

// ═══════════════════════════════════════════
// SCROLL
// ═══════════════════════════════════════════
let scrollProgress = 0;
let smoothProgress = 0;
const LERP_FACTOR = 0.06;

window.addEventListener('scroll', () => {
  const maxScroll = document.body.scrollHeight - innerHeight;
  scrollProgress = Math.max(0, Math.min(1, window.scrollY / maxScroll));
});

// ═══════════════════════════════════════════
// ANIMATION
// ═══════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const time = clock.getElapsedTime();
  
  smoothProgress += (scrollProgress - smoothProgress) * LERP_FACTOR;
  const p = smoothProgress;
  
  document.getElementById('progress-bar').style.width = (p * 100) + '%';
  
  let phaseName = 'idle';
  if (p > 0.1) phaseName = 'bubbly';
  if (p > 0.25) phaseName = 'mitosis';
  if (p > 0.55) phaseName = 'separate';
  if (p > 0.6) phaseName = 'morph-square';
  if (p > 0.85) phaseName = 'grow';
  document.getElementById('phase-label').textContent = `phase: ${phaseName} (${(p*100).toFixed(0)}%)`;
  
  document.getElementById('sec-0').classList.toggle('active', p < 0.15);
  document.getElementById('sec-1').classList.toggle('active', p > 0.2 && p < 0.55);
  document.getElementById('sec-2').classList.toggle('active', p > 0.7);
  document.getElementById('scroll-hint').style.opacity = Math.max(0, 1 - p * 5);
  
  // Core visibility
  const coreOpacity = 1.0 - smoothstep(0.2, 0.35, p);
  coreMesh.visible = coreOpacity > 0.01;
  
  if (coreMesh.visible) {
    coreMat.uniforms.uProgress.value = p;
    coreMat.uniforms.uTime.value = time;
    coreMat.uniforms.uOpacity.value = coreOpacity;
    
    const rotSpeed = 0.3 * (1 - smoothstep(0.1, 0.3, p));
    coreMesh.rotation.y = time * rotSpeed;
    coreMesh.rotation.x = Math.sin(time * 0.2) * 0.1;
  }
  
  // Split visibility
  const splitOpacity = smoothstep(0.2, 0.35, p);
  leftMesh.visible = splitOpacity > 0.01;
  rightMesh.visible = splitOpacity > 0.01;
  
  if (leftMesh.visible) {
    leftMat.uniforms.uProgress.value = p;
    leftMat.uniforms.uTime.value = time;
    leftMat.uniforms.uOpacity.value = splitOpacity;
    
    rightMat.uniforms.uProgress.value = p;
    rightMat.uniforms.uTime.value = time;
    rightMat.uniforms.uOpacity.value = splitOpacity;
    
    const splitRot = (p - 0.3) * 0.5;
    leftMesh.rotation.y = -splitRot + Math.sin(time * 0.3) * 0.05;
    leftMesh.rotation.x = Math.sin(time * 0.25) * 0.05;
    
    rightMesh.rotation.y = splitRot + Math.sin(time * 0.3 + 1) * 0.05;
    rightMesh.rotation.x = Math.sin(time * 0.25 + 1) * 0.05;
  }
  
  // Drops
  dropMat.uniforms.uProgress.value = p;
  dropMat.uniforms.uTime.value = time;
  
  // Camera
  camera.position.x = Math.sin(time * 0.1) * 0.1;
  camera.position.y = Math.cos(time * 0.15) * 0.05;
  camera.lookAt(0, 0, 0);
  
  bloom.strength = 0.4 + smoothstep(0.2, 0.4, p) * 0.4 - smoothstep(0.6, 0.8, p) * 0.2;
  
  composer.render();
}

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
