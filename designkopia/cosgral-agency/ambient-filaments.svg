<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- Statyczny odpowiednik dawnego shadera WebGL: swietlne wlokna na ciemnym tle.
       feGaussianBlur jest tu bezpieczny, bo ta warstwa rasteryzuje sie RAZ i potem
       tylko przesuwa transformem — filtr nie jest liczony na kazda klatke.
       Wczesniej strona liczyla 4 iteracje sin/cos na kazdy fragment, 60 razy/s. -->
  <defs>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="halo-tight" x="-20%" y="-20%" width="140%" height="140%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <linearGradient id="fade-a" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="fade-b" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="fade-c" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>

    <path id="fil-a" d="M 205,-60 C 150,180 128,306 192,436 C 256,566 382,706 474,960"/>
    <path id="fil-b" d="M 352,-60 C 334,124 318,252 400,332 C 482,412 622,330 762,150 C 832,58 862,4 884,-60"/>
    <path id="fil-c" d="M 984,-60 C 1000,92 1032,162 1132,186 C 1252,216 1322,190 1352,252 C 1382,314 1350,422 1396,522 C 1426,588 1442,622 1472,700"/>
    <path id="fil-d" d="M 1500,712 C 1360,668 1262,714 1188,812 C 1136,882 1108,936 1098,1000"/>
  </defs>

  <g fill="none" stroke-linecap="round">
    <!-- szeroka poswiata -->
    <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="5" filter="url(#halo)">
      <use href="#fil-a"/><use href="#fil-b"/><use href="#fil-c"/><use href="#fil-d"/>
    </g>
    <!-- ciasna poswiata przy rdzeniu -->
    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.4" filter="url(#halo-tight)">
      <use href="#fil-a"/><use href="#fil-b"/><use href="#fil-c"/><use href="#fil-d"/>
    </g>
    <!-- rdzen -->
    <g stroke-width="1.5">
      <use href="#fil-a" stroke="url(#fade-a)"/>
      <use href="#fil-b" stroke="url(#fade-b)"/>
      <use href="#fil-c" stroke="url(#fade-c)"/>
      <use href="#fil-d" stroke="url(#fade-b)"/>
    </g>
  </g>
</svg>
