product_visual_spec: >
  50ml matte black cylindrical dropper bottle. Short wide cylinder (not tall skinny).
  Matte black glass/plastic body, black dropper cap.
  Small white sans-serif label on front: "ÉLAN" top line, "SCALP SERUM" second line,
  "50 ML" third line — all centered, minimal, no other graphics.
  Same exact bottle proportions, same cap, same label in every shot.
  NOT perfume flacon. NOT gold accents. NOT colored liquid visible.

notes:
  active: peptydy, niacynamid, olej jojoba
  use: 2–3 krople na skórę głowy wieczorem
  format: 50 ml dropper

