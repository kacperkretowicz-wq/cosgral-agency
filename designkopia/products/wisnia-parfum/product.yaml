version: "1"
brand: WIŚNIA
slug: wisnia-parfum
type: product_brand
job_type: product_brand

tagline: Cherry, distilled.
positioning: >
  Wisniowe perfumy niche w miękkim DTC wydaniu — blush, mauve, wiśnia.
  Designerski minimal: przezroczyste szkło, matowa czapka, zero złota, zero tekstu na etykiecie.

concept_id: B
layout_archetype: lumera-commercial
palette_family: dusty_rose_mauve
job_palette: dusty_rose_mauve

product_visual_spec: >
  Artisan crystal perfume bottle, 50ml, highly irregular sculptural glass form —
  curved banana-like silhouette, asymmetric faceted cut crystal, NOT symmetrical,
  NOT rectangular. Strange niche designer flacon shape.
  Deep burgundy-cherry liquid inside (dark wine-red).
  Matte blush-rose cylindrical cap (NOT gold atomizer, NOT spherical).
  Minimal branding ON glass: embossed or sandblasted text "WIŚNIA" only — small,
  elegant, vertical or subtle on one facet. No other text.
  Same exact bottle shape in every shot. Same cap. Same liquid level ~85%.

notes:
  top: wild cherry, bitter almond
  heart: cherry blossom, iris
  base: black tea, soft wood

shot_brief_source: profiles/job-types/product-brand.yaml

