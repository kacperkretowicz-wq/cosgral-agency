# ─────────────────────────────────────────────────────────────────────────
# SITE-DNA EFFECTS LIBRARY — rosnąca biblioteka efektów WYUCZONYCH z analiz /site-dna.
#
# Zasila ją skill .claude/skills/site-dna/SKILL.md (Krok 4). Czytają:
# motion-director, motion-implementer, effect-smith, framer-effects-researcher.
#
# Relacja do innych rejestrów:
#   - profiles/site-clone-registry.yaml  → techniki z ręcznie sklonowanych stron
#     (voyeur-*, playfight-*, parhouse-*) — NIE duplikuj ich tutaj, linkuj przez see.
#   - profiles/effects-stack.yaml        → kanoniczny katalog technik w stacku docelowym;
#     jeśli technika pasuje do istniejącego technique_id, użyj pola canonical_id.
#
# Schemat wpisu:
#   <slug-strony>-<nazwa-efektu>:
#     what: co robi (1 zdanie, po polsku)
#     lib: czym zrobione w oryginale (gsap/ScrollTrigger, three.js, CSS…)
#     dom: [zaczepy DOM / data-atrybuty z oryginału]
#     impl_sketch: >
#       skrót JAK to działa (wartości: pin, scrub, end, ease, stagger) — z realnego JS
#     react_equiv: web/lib/effects/<Komponent>.tsx | "(brak — kandydat dla effect-smith)"
#     canonical_id: technique_id z effects-stack.yaml (jeśli pasuje)
#     see: id z site-clone-registry.yaml (jeśli to ta sama technika)
#     seen_on: [url1, url2]          # częstość = które efekty są "standardem branży"
#     first_seen: YYYY-MM-DD
#     caution: opcjonalnie (laggy / a11y / perf)
#     rating: 1-5                    # jak bardzo warte skopiowania (ocena kuratora)
# ─────────────────────────────────────────────────────────────────────────

version: "1"
updated_at: "2026-07-05"

techniques:

  # ── letsplayfight.com (analiza /site-dna 2026-07-05) ────────────────────
  letsplayfight-hero-scroll-scrub:
    what: hero pin + scrub — mega-typo skaluje sie i wyjezdza maska przy scrollu
    lib: gsap/ScrollTrigger (pin:1, scrub:1) + clip-path
    dom: ["[data-anim-hero-scroll]"]
    impl_sketch: >
      ScrollTrigger.create({ pin: true, scrub: 1 }) na hero; typewriter w h1;
      easingi: power4.out (wejscie), none (scrub). Dowod: capture/dyn00-main.js
    react_equiv: web/lib/effects/PinnedSequence.tsx + MaskedReveal.tsx
    canonical_id: pinned-scroll-sequence
    seen_on: [https://www.letsplayfight.com]
    first_seen: 2026-07-05
    rating: 5

  letsplayfight-service-hover-reveal:
    what: hover na pozycji listy uslug odsania media (opacity+scale, expo.out)
    lib: gsap
    dom: ["[data-service-hover]", ".service_item"]
    impl_sketch: "tween ~0.6s expo.out na kontener mediow; wyjscie symetryczne"
    react_equiv: "(brak 1:1 — kandydat dla effect-smith: HoverMediaReveal)"
    seen_on: [https://www.letsplayfight.com]
    first_seen: 2026-07-05
    rating: 4

