  # ── parhouse.agency (analiza /site-dna 2026-07-05) ──────────────────────
  parhouse-cursor-preloader:
    what: kursor JEST preloaderem — kropka skaluje sie x60 na caly ekran, licznik 0-100, zwezenie odsania strone
    lib: gsap timeline + counter
    dom: ["#parhouse-custom-cursor", "#custom-cursor-preloader"]
    impl_sketch: >
      to(cursor, {scaleX:60, scaleY:60, duration:1.6, ease:"power3"})
      -> set('#custom-cursor-preloader', {display:"block"})
      -> counter(end:100, duration:.8) -> reverse scale -> tryb follow (xPercent:-50).
      Dowod: capture/01-a6974c8a...js
    react_equiv: "(brak — kandydat dla effect-smith: CursorPreloader)"
    seen_on: [https://parhouse.agency]
    first_seen: 2026-07-05
    caution: "desktop-only (pointer: fine); prefers-reduced-motion -> prosty fade"
    rating: 5

  parhouse-growing-header:
    what: naglowek dostaje height 100vh z JS, rosnie/trzyma ekran przy scrollu, tresc odjezdza z fade
    lib: gsap/ScrollTrigger (start "center center", end "90% top", scrub)
    dom: [".special-growing-header"]
    impl_sketch: >
      gsap.set(el, {height: innerHeight}); timeline scrub: yPercent 25 -> 50 + opacity 0
      na wyjsciu. Dowod: capture/01-a6974c8a...js
    react_equiv: web/lib/effects/PinnedSequence.tsx (wariant)
    canonical_id: pinned-scroll-sequence
    seen_on: [https://parhouse.agency]
    first_seen: 2026-07-05
    rating: 4

