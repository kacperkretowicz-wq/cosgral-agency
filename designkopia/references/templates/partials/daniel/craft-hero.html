<section class="section section--{{section_id}} tpl-daniel tpl-hero {{extra_class}}" id="{{section_id}}" data-template="daniel">
  <div class="daniel-craft">
    <figure class="daniel-photo">
      <img src="{{image_src}}" alt="{{image_alt}}" style="object-position: {{object_position}}">
    </figure>
    <div class="daniel-intro">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{heading}}</h1>
      <p class="section-lead">{{lead}}</p>
      <p class="daniel-meta">{{meta}}</p>
    </div>
  </div>
</section>
