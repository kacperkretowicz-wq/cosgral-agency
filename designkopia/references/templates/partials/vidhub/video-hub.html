<section class="section section--{{section_id}} tpl-vidhub tpl-hero {{extra_class}}" id="{{section_id}}" data-template="vidhub">
  <div class="vidhub-stage">
    <video class="vidhub-loop" autoplay muted loop playsinline poster="{{poster_src}}">
      <source src="{{video_src}}" type="video/mp4">
    </video>
    <div class="vidhub-overlay">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{heading}}</h1>
      <p class="section-lead">{{lead}}</p>
    </div>
  </div>
</section>
