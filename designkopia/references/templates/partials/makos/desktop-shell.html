<section class="section section--{{section_id}} tpl-makos tpl-hero {{extra_class}}" id="{{section_id}}" data-template="makos">
  <div class="makos-window" role="presentation">
    <header class="makos-chrome">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="makos-title">{{window_title}}</span>
    </header>
    <div class="makos-body">
      <aside class="makos-sidebar">
        <p class="eyebrow">{{eyebrow}}</p>
        <nav>{{sidebar_nav}}</nav>
      </aside>
      <div class="makos-main">
        <h1>{{heading}}</h1>
        <p class="section-lead">{{lead}}</p>
        <div class="makos-tiles">{{tiles_html}}</div>
      </div>
    </div>
  </div>
</section>
