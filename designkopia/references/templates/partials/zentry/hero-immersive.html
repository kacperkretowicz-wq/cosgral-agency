<section class="section section--{{section_id}} tpl-zentry {{extra_class}}" id="{{section_id}}" data-template="zentry" data-noise-ambient>
  <div class="zentry-immersive">
    <div class="zentry-bg" style="background: {{bg_gradient}}"></div>
    <div class="zentry-content">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 class="zentry-display">{{heading}}</h1>
      <p class="section-lead">{{lead}}</p>
    </div>
    <figure class="zentry-float">
      <img src="{{image_src}}" alt="{{image_alt}}" style="object-position: {{object_position}}">
    </figure>
  </div>
</section>
