<section class="section section--{{section_id}} tpl-hero-minimal {{extra_class}}" id="{{section_id}}" data-template="hero-minimal">
  <div class="hero-minimal-layout">
    <figure class="hero-minimal-product">
      <img src="{{image_src}}" alt="{{image_alt}}" style="object-position: {{object_position}}">
    </figure>
    <div class="hero-minimal-copy">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{heading}}</h1>
      <p class="section-lead">{{lead}}</p>
      <a class="btn-origin cta" href="{{cta_href}}">{{cta_label}}</a>
    </div>
  </div>
</section>
