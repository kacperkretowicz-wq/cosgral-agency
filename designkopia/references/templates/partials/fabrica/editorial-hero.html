<section class="section section--{{section_id}} tpl-fabrica tpl-hero {{extra_class}}" id="{{section_id}}" data-template="fabrica">
  <div class="fabrica-hero">
    <figure class="fabrica-figure fabrica-figure--tall">
      <img src="{{image_src}}" alt="{{image_alt}}" style="object-position: {{object_position}}">
    </figure>
    <div class="fabrica-copy">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{heading}}</h1>
      <p class="section-lead">{{lead}}</p>
    </div>
  </div>
</section>
