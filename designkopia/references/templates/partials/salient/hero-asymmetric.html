<section class="section section--{{section_id}} tpl-salient tpl-hero {{extra_class}}" id="{{section_id}}" data-template="salient">
  <div class="salient-hero">
    <div class="salient-copy">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{heading}}</h1>
      <p class="section-lead">{{lead}}</p>
    </div>
    <figure class="salient-media salient-asym">
      <img src="{{image_src}}" alt="{{image_alt}}" style="object-position: {{object_position}}">
    </figure>
  </div>
</section>
