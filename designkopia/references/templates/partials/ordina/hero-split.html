<section class="section section--{{section_id}} tpl-ordina tpl-hero {{extra_class}}" id="{{section_id}}" data-template="ordina">
  <div class="section-inner ordina-split">
    <div class="ordina-copy">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{heading}}</h1>
      <p class="section-lead">{{lead}}</p>
      <a class="btn-origin cta" href="{{cta_href}}">{{cta_label}}</a>
    </div>
    <figure class="ordina-visual">
      <img src="{{image_src}}" alt="{{image_alt}}" style="object-position: {{object_position}}">
    </figure>
  </div>
</section>
