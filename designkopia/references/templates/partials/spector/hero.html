<section class="section section--{{section_id}} tpl-spector tpl-hero {{extra_class}}" id="{{section_id}}" data-template="spector" data-slide="{{slide_num}}">
  <div class="section-inner hero-spector">
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{heading}}</h1>
    <p class="section-lead">{{lead}}</p>
    {{#cta}}<a class="btn-origin cta" href="{{cta_href}}">{{cta_label}}</a>{{/cta}}
    <figure class="hero-media-spector">
      <img src="{{image_src}}" alt="{{image_alt}}" style="object-position: {{object_position}}">
      {{#video_badge}}<span class="video-badge">{{video_badge}}</span>{{/video_badge}}
    </figure>
  </div>
</section>
