<section class="section section--{{section_id}} tpl-spector tpl-manifesto {{extra_class}}" id="{{section_id}}" data-template="spector">
  <div class="manifesto-spector">
    <div class="manifesto-display">
      <span class="display-line">{{line_1}}</span>
      <span class="display-line">{{line_2}}</span>
      <span class="display-line accent">{{line_3}}</span>
    </div>
    <div class="manifesto-body">
      <p class="eyebrow">{{eyebrow}}</p>
      <p>{{body}}</p>
    </div>
  </div>
</section>
