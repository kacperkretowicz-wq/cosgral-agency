# Rejestr zużytych assetów — inspiracja ≠ final, zero reużycia PNG w UI

version: "1"
updated_at: "2026-06-24"

rules:
  inspiration_files:
    path_prefixes:
      - references/inspiration/
      - references/style/
    rule: "NIGDY nie kopiować 1:1 do outputs/images/ ani HTML — tylko styl do promptu GenerateImage"
  approved_files:
    path_prefix: profiles/approved/
    rule: "Kopiowanie dobra tylko gdy user explicit lub brak GenerateImage; zawsze rebranduj nazwę pliku per job"
  output_images:
    rule: "Każdy plik w outputs/images/<job>/ użyty max w tym jobie; jeden folder = jeden job (clean-image-job-folders.py)"
  reference_structure:
    style: references/style-dna/
    agency_subject: references/agency-content/
    ui_only: references/moodboards-ui/

# Pliki już użyte jako FINAL w HTML (nie używać ponownie w nowych jobach)
