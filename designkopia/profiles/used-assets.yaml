# Inspiracje już „spalone” jako główny motyw wizualny (preferuj inny folder przy nowym jobie)
inspiration_themes_used:
  - theme: bold-red-editorial
    last_job: sioo-agency
    refs: [references/inspiration/bold-red-editorial/red-mirror-woman-white-blazer.png]
  - theme: beauty-skincare-macro
    last_job: sioo-agency
    refs: [references/inspiration/beauty-skincare-macro/water-droplets-face-macro.png]

gate:
  agent: image-generator
  on_conflict: "FAIL — wybierz inny inspiration_ref lub wygeneruj nowy kadr"
  update_after_job: "Dopisz każdy nowy plik z manifest.json do used_in_ui"
