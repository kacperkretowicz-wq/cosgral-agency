# 11 referencji w references/style/ (01-11)

version: "1"
updated_at: "2026-06-25"
reference_count: 11
inspiration_count: 29
inspiration_manifest: references/inspiration/manifest.yaml
calibrated: true
calibrated_at: "2026-06-22"

style_family: editorial_premium_agency
style_summary: >
  Różnorodny, ale spójny styl premium editorial / design agency: odważna kolorystyka
  LUB high-contrast B&W, minimalistyczna kompozycja, dramatyczne światło, produkt
  lub portret jako bohater kadru. Nie generic e-commerce — raczej lookbook, case study,
  kampania kreatywna.

lighting: mixed
lighting_modes:
  - hard_directional: sharp shadows, chiaroscuro, architectural light on geometric sets
  - soft_studio: diffused premium studio, subtle contact shadows on products
  - cinematic_gel: colored rim/side light (red, orange), moody portraits
  - natural_hard: direct sunlight, strong shadows on stone/textured surfaces

background: >
  Solid saturated color fields (red, orange, sage, navy), neutral warm beige/cream,
  strict light grey for B&W, geometric blocks (white cubes, stone steps), minimal props.
  Nigdy busy cluttered scenes.

camera:
  angle: "Mix: profile portraits, dynamic product tilt 20-30°, centered hero, top-down editorial, tight macro"
  focal_feel: medium format editorial, fashion campaign, design agency portfolio
  depth_of_field: shallow on subject with soft or graphic background falloff

color_grade:
  temperature: "Variable — warm editorial OR neutral B&W; pick one palette per shot"
  contrast: high
  saturation: "Bold monochromatic color stories OR desaturated B&W; avoid muddy mid-tones"
  palette_families:
    - bold_monochrome: single saturated color (red-on-red, orange studio) + white/black type accents
    - bw_editorial: strict black white grey, graphic shadows
    - warm_organic: cream, beige, terracotta, sage, earthy luxury
    - deep_luxury: navy, forest green, gold accents
    - purple_magenta: indigo, orchid, neon pink — night / fashion with color
    - aqua_orange: turquoise water + punchy orange accent — summer lifestyle
    - green_yellow: forest green + saturated yellow — sporty editorial moodboards

realism_level: natural
realism_notes: >
  Photorealistic, high-end retouch but not plastic. Macro skin texture OK when beauty/lifestyle.
  Products: matte/semi-matte premium packaging, subtle studio shadows.

props_and_composition: >
  Minimal intentional props: geometric pedestals, stone blocks, knit textures, mesh bags,
  plants casting shadows. Generous negative space. Product often angled or floating.
  Portraits: profile, hand-over-face, motion blur edges OK for artistic shots.
  Typography in-scene when hero/web: bold all-caps sans-serif, ghost buttons — optional for pure product shots.

negative_prompts:
  - cheap amateur snapshot look
  - flat even lighting with no shadows
  - cluttered messy background
  - oversaturated neon rainbow unrelated colors
  - cartoon illustration CGI fake look
  - watermark text overlay stock photo feel
  - distorted product proportions
  - generic white-background Amazon packshot (unless explicitly requested)
  - low resolution soft blur on main subject
  - chess pieces on green velvet (user rejected st03-04)
  - jewelry ring macro on black sand (user rejected st03-09)
  - neon green liquid in glass macro (user rejected st03-10)
  - liquid silk gown on navy background mannequin CGI (noir-03 — sztuczne, nie generować)

prompt_prefix: "Premium editorial product and brand photography, design agency campaign quality,"
prompt_suffix: "intentional composition, high contrast, photorealistic, no watermark, no random text, 8k detail, magazine editorial finish"

notes: >
  Styl celowo różnorodny w execution (B&W vs bold color vs warm organic), ale wspólny DNA:
  premium, minimal, high-contrast, editorial. Przy generacji wybierz jeden color_mode z palette_families
  pasujący do produktu/kontekstu — nie mieszaj w jednym kadrze red studio z sage packaging unless prompt asks.
