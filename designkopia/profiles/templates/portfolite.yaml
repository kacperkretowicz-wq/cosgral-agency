id: portfolite
name: Portfolite — Dark Brand Portfolio
source_image: references/templates/portfolite.md
preview_url: https://portfolite.framer.website/
marketplace_url: https://www.framer.com/community/marketplace/templates/portfolite/
creator: Framebase
tags:
  - hero
  - nav
  - portfolio
  - cta
  - about
  - features
  - testimonials
  - faq
  - footer

sections:
  - id: nav
    type: nav
    layout: split
    notes: "Logo Portfolite, links Services/Projects/Testimonials/Contact, CTA Get Template"
  - id: hero
    type: hero
    layout: centered
    notes: "Dark bg, abstract white light streak, badge, headline, dual CTA, scroll indicator"
  - id: logo-bar
    type: features
    layout: row
    notes: "Monochrome client logos (Asterisk, Cooks, Opal…)"
  - id: portfolio-masonry
    type: product-grid
    layout: masonry
    notes: "Grayscale project images, glass View Casestudy buttons"
  - id: about
    type: about
    layout: split
    notes: "Meet Meily — bio + experience tags"
  - id: process
    type: features
    layout: three-column
    columns: 3
    notes: "Define Vision → Submit Request → Project Delivered (numbered 1-3)"
  - id: services
    type: features
    layout: grid
    columns: 2
    notes: "Brand Identity, Package Design, Brand Design, Mockup Design cards"
  - id: reviews
    type: testimonials
    layout: split
    notes: "Stats 180+ projects, 96% satisfaction, 15+ years + client quotes"
  - id: faq
    type: faq
    layout: accordion
    notes: "Common questions accordion"
  - id: footer
    type: footer
    layout: centered
    notes: "Nav repeat + Book a Free Call"

typography:
  heading_font: "Inter"
  body_font: "Inter"
  heading_sizes:
    h1: "clamp(2.5rem, 6vw, 4.5rem)"
    h2: "2.5rem"
  body_size: "1rem"
  weights:
    heading: 600
    body: 400

spacing:
  page_max_width: "1200px"
  section_padding_y: "96px"
  section_padding_x: "24px"
  grid_columns: 12
  gap: "32px"

color_tokens:
  background: "#000000"
  background_alt: "#0A0A0A"
  accent: "#FFFFFF"
  text: "#FFFFFF"
  muted: "#888888"
  button_primary: "#000000"
  button_glow: "rgba(255,255,255,0.15)"

mixable_with:
  - salient
  - taylor
  - kirk
  - grid-editorial

notes: >
  Dark mode premium portfolio. Glassmorphism CTA, grayscale imagery, abstract light hero.
  Dobry na case study grid + testimonials + FAQ.
