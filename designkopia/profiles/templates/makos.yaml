id: makos
name: MakOS — Creative Portfolio (macOS UI)
source_image: references/templates/makos.md
preview_url: https://makos.framer.website/
marketplace_url: https://www.framer.com/community/marketplace/templates/makos/
tags:
  - nav
  - portfolio
  - minimal
  - creative
  - desktop-ui
  - playful

sections:
  - id: desktop-shell
    type: hero
    layout: desktop-window
    notes: "macOS-style window chrome, sidebar About/Notes, project files grid"
  - id: projects-grid
    type: portfolio
    layout: grid
    notes: "Project tiles as files — Champ Silencieux, Lisière, etc."
  - id: social
    type: footer
    layout: row
    notes: "Instagram, X, Behance links"

typography:
  heading_font: "Inter"
  body_font: "Inter"
  heading_sizes:
    h1: "1.5rem"
  body_size: "0.875rem"
  weights:
    heading: 600
    body: 400

spacing:
  page_max_width: "1200px"
  section_padding_y: "48px"
  section_padding_x: "24px"
  grid_columns: 12
  gap: "16px"

color_tokens:
  background: "#F7F7F7"
  accent: "#34C75A"
  text: "#000000"
  muted: "#86868B"
  window_chrome: "#E5E5EA"

mixable_with:
  - daniel
  - luzia
  - majd
  - portfolite

notes: "Playful macOS metaphor — unikalny shell UI, nie klasyczny scroll landing."
