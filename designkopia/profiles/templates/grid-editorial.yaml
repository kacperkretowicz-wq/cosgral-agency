# Przykładowy template — nadpisz przez template-analyst po /design-onboard

id: grid-editorial
name: Product Grid Editorial
source_image: references/templates/grid-editorial.svg
tags:
  - product-grid
  - lifestyle
  - editorial

sections:
  - id: product-grid
    type: product-grid
    layout: asymmetric
    columns: 2
    notes: "Duże zdjęcie lifestyle + mniejsze packshoty w siatce"
  - id: features
    type: features
    layout: three-column
    columns: 3
    notes: "Krótkie benefit bullets z ikonami lub numerami"

typography:
  heading_font: "Playfair Display"
  body_font: "Inter"
  heading_sizes:
    h1: "2.5rem"
    h2: "1.75rem"
  body_size: "1rem"
  weights:
    heading: 500
    body: 400

spacing:
  page_max_width: "1200px"
  section_padding_y: "80px"
  section_padding_x: "24px"
  grid_columns: 12
  gap: "24px"

color_tokens:
  background: "#FFFFFF"
  accent: "#2C2C2C"
  text: "#1A1A1A"
  muted: "#6B6B6B"

mixable_with:
  - hero-minimal
  - cta-minimal
  - kirk
  - portfolite
  - salient

notes: "Szablon startowy. Główne templatey Framer: kirk, portfolite, taylor, salient."
