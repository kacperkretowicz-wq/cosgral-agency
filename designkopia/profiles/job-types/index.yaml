# Taksonomia typów jobów — każdy ma research lane + shot brief + pipeline

version: "1"
updated_at: "2026-06-24"

# Klasyfikacja na starcie (design-orchestrator / domain-strategist)
classification_hints:
  agency_portfolio: [agencja, agency, studio, portfolio, case study, branding studio]
  product_brand: [produkt, SKU, packshot, serum, cosmetics, lip pencil]
  automotive_campaign: [samochód, auto, automotive, EV, dealer, campaign]
  fashion_retail: [fashion, lookbook, kolekcja, retail, butik]
  ecommerce_shop: [sklep, shop, e-commerce, kolekcja, cart, checkout]
  food_beverage: [food, napój, restaurant, FMCG, bottle]
  saas_tech: [SaaS, app, software, startup, dashboard]
  photographer_portfolio: [fotograf, photographer, gallery, prints]

types:
