<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>CG Mitosis — HyperFrames</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #cg-canvas {
        display: block;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-199x" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <section data-hf-id="hf-a9w8" id="stage" class="clip" data-start="0" data-duration="10" data-track-index="1">
        <canvas data-hf-id="hf-r825" id="cg-canvas"></canvas>
        <div data-hf-id="hf-jkfq" id="hf-driver" aria-hidden="true" style="position: absolute; width: 1px; height: 1px; left: 0; top: 0"></div>
      </section>
    </div>

    <script type="module">
      import * as THREE from "three";

      const DURATION = 10;
      const W = 1920;
      const H = 1080;

      function seededRandom(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      const rand = seededRandom(0xc901ca);

      function smoothstep(e0, e1, x) {
        const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return t * t * (3 - 2 * t);
      }

      function makeFaceTexture(letter) {
        const size = 512;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, size, size);

        if (letter) {
          const g = ctx.createLinearGradient(0, 0, size, size);
          g.addColorStop(0, "#f7f7f7");
          g.addColorStop(1, "#ededed");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, size, size);

          ctx.strokeStyle = "#d8d8d8";
          ctx.lineWidth = size * 0.018;
          const pad = size * 0.14;
          ctx.strokeRect(pad, pad, size - pad * 2, size - pad * 2);

          ctx.fillStyle = "#ececec";
          ctx.font = `700 ${size * 0.52}px "Arial Black", Arial, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(letter, size * 0.5, size * 0.54);

          ctx.fillStyle = "#ffffff";
          ctx.globalAlpha = 0.35;
          ctx.fillText(letter, size * 0.48, size * 0.51);
          ctx.globalAlpha = 1;
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const plainTex = makeFaceTexture(null);
      const cTex = makeFaceTexture("C");
      const gTex = makeFaceTexture("G");

      const VERT = `
        uniform float uProgress;
        uniform float uTime;
        uniform float uSide;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying float vFresnel;
        varying float vFlatMix;
        varying vec2 vUv;
        varying vec3 vObjNormal;

        vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
        vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v){
          const vec2 C = vec2(1.0/6.0, 1.0/3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
          vec3 i = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);
          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);
          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;
          i = mod(i, 289.0);
          vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
            + i.y + vec4(0.0, i1.y, i2.y, 1.0))
            + i.x + vec4(0.0, i1.x, i2.x, 1.0));
          float n_ = 1.0/7.0;
          vec3 ns = n_ * D.wyz - D.xzx;
          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);
          vec4 hx = x_ * ns.x + ns.yyyy;
          vec4 hy = y_ * ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(hx) - abs(hy);
          vec4 b0 = vec4(hx.xy, hy.xy);
          vec4 b1 = vec4(hx.zw, hy.zw);
          vec4 s0 = floor(b0)*2.0 + 1.0;
          vec4 s1 = floor(b1)*2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));
          vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
          vec3 p0 = vec3(a0.xy, h.x);
          vec3 p1 = vec3(a0.zw, h.y);
          vec3 p2 = vec3(a1.xy, h.z);
          vec3 p3 = vec3(a1.zw, h.w);
          vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
          m = m * m;
          return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        float easePhase(float a, float b, float x) {
          float t = clamp((x - a) / (b - a), 0.0, 1.0);
          return t * t * (3.0 - 2.0 * t);
        }

        void main() {
          vec3 pos = position;
          vec3 nrm = normal;
          vUv = uv;
          vObjNormal = nrm;

          float vibratePhase = easePhase(0.08, 0.14, uProgress) * (1.0 - easePhase(0.28, 0.34, uProgress));
          float clayPhase = easePhase(0.12, 0.22, uProgress) * (1.0 - easePhase(0.48, 0.58, uProgress));
          float splitPhase = easePhase(0.30, 0.48, uProgress);
          float flatPhase = easePhase(0.62, 0.82, uProgress);
          vFlatMix = flatPhase;

          float wobble = clayPhase + vibratePhase * 0.45;
          float n0 = snoise(pos * 1.8 + uTime * 0.35) * wobble;
          float n1 = snoise(pos * 3.6 - uTime * 0.28) * wobble * 0.55;
          float n2 = snoise(pos * 7.0 + uTime * 0.42) * clayPhase * 0.3;
          float noise = n0 + n1 + n2;

          pos += nrm * noise * 0.11;
          pos += nrm * sin(uTime * 18.0 + pos.y * 9.0) * vibratePhase * 0.018;

          pos.x *= 1.0 + splitPhase * 0.22;
          float pinch = splitPhase * (1.0 - easePhase(0.40, 0.62, uProgress)) * 0.55;
          float waist = 1.0 - smoothstep(0.0, 0.42, abs(pos.x));
          pos.y *= 1.0 - waist * pinch * 0.32;
          pos.z *= 1.0 - waist * pinch * 0.32;

          if (abs(uSide) > 0.5) {
            pos.x -= uSide * (1.0 - flatPhase) * 0.08;
          }

          pos.z = mix(pos.z, 0.0, flatPhase * 0.92);

          float halfSize = mix(0.72, 0.62, flatPhase);
          vec2 sq = clamp(pos.xy, -halfSize, halfSize);
          pos.xy = mix(pos.xy, sq, flatPhase * 0.62);

          vec3 bumped = normalize(nrm + nrm * noise * 0.9);
          vec3 flatN = vec3(0.0, 0.0, 1.0);
          vec3 shadedN = normalize(mix(bumped, flatN, flatPhase * 0.94));
          vNormal = normalMatrix * shadedN;
          vWorldPos = (modelMatrix * vec4(pos, 1.0)).xyz;

          vec3 wN = normalize((modelMatrix * vec4(shadedN, 0.0)).xyz);
          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          vFresnel = pow(1.0 - max(dot(wN, viewDir), 0.0), 2.8) * (1.0 - flatPhase * 0.35);

          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `;

      const FRAG = `
        uniform sampler2D uTexPlain;
        uniform sampler2D uTexC;
        uniform sampler2D uTexG;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        varying float vFresnel;
        varying float vFlatMix;
        varying vec2 vUv;
        varying vec3 vObjNormal;

        void main() {
          vec3 n = normalize(vNormal);
          vec3 on = normalize(vObjNormal);
          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          vec3 light1 = normalize(vec3(1.2, 2.4, 3.2));
          vec3 light2 = normalize(vec3(-1.5, 0.8, 2.0));

          float diff1 = max(dot(n, light1), 0.0);
          float diff2 = max(dot(n, light2), 0.0) * 0.28;
          float wrap = max(dot(n, light1) * 0.5 + 0.5, 0.0);

          vec3 albedo = texture2D(uTexPlain, vUv).rgb;
          if (on.y > 0.62) {
            albedo = texture2D(uTexC, vUv).rgb;
          } else if (on.z > 0.62) {
            albedo = texture2D(uTexG, vUv).rgb;
          }

          vec3 shadow = albedo * 0.84;
          vec3 lit = mix(shadow, albedo, wrap * 0.5 + diff1 * 0.32 + diff2);
          lit += albedo * vFresnel * 0.55;
          lit += vec3(1.0) * vFresnel * 0.22;

          vec3 H = normalize(light1 + viewDir);
          float spec = pow(max(dot(n, H), 0.0), 64.0) * 0.12 * (1.0 - vFlatMix * 0.7);
          lit += vec3(1.0) * spec;

          gl_FragColor = vec4(lit, 1.0);
        }
      `;

      function makeClayMaterial(side) {
        return new THREE.ShaderMaterial({
          vertexShader: VERT,
          fragmentShader: FRAG,
          uniforms: {
            uProgress: { value: 0 },
            uTime: { value: 0 },
            uSide: { value: side },
            uTexPlain: { value: plainTex },
            uTexC: { value: cTex },
            uTexG: { value: gTex },
          },
          side: THREE.FrontSide,
        });
      }

      const canvas = document.getElementById("cg-canvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
      });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.setClearColor(0x000000, 1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
      camera.position.set(4.2, 3.6, 4.2);
      camera.lookAt(0, 0, 0);

      const rig = new THREE.Group();
      rig.rotation.x = -0.28;
      rig.rotation.y = 0.72;
      scene.add(rig);

      const boxGeo = new THREE.BoxGeometry(1.35, 1.35, 1.35, 48, 48, 48);

      const coreMat = makeClayMaterial(0);
      const coreMesh = new THREE.Mesh(boxGeo, coreMat);
      rig.add(coreMesh);

      const leftMat = makeClayMaterial(-1);
      const leftMesh = new THREE.Mesh(boxGeo, leftMat);
      leftMesh.visible = false;
      rig.add(leftMesh);

      const rightMat = makeClayMaterial(1);
      const rightMesh = new THREE.Mesh(boxGeo, rightMat);
      rightMesh.visible = false;
      rig.add(rightMesh);

      const dropCount = 90;
      const dropGeo = new THREE.BufferGeometry();
      const dropPos = new Float32Array(dropCount * 3);
      const dropSize = new Float32Array(dropCount);
      const dropSpeed = new Float32Array(dropCount);
      const dropOff = new Float32Array(dropCount);

      for (let i = 0; i < dropCount; i++) {
        const t = rand() * Math.PI * 2;
        const p = Math.acos(rand() * 2 - 1);
        const r = 1.05 + rand() * 0.45;
        dropPos[i * 3] = r * Math.sin(p) * Math.cos(t);
        dropPos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
        dropPos[i * 3 + 2] = r * Math.cos(p);
        dropSize[i] = rand() * 2.2 + 0.6;
        dropSpeed[i] = rand() * 2.0 + 0.8;
        dropOff[i] = rand() * Math.PI * 2;
      }

      dropGeo.setAttribute("position", new THREE.BufferAttribute(dropPos, 3));
      dropGeo.setAttribute("aSize", new THREE.BufferAttribute(dropSize, 1));
      dropGeo.setAttribute("aSpeed", new THREE.BufferAttribute(dropSpeed, 1));
      dropGeo.setAttribute("aOffset", new THREE.BufferAttribute(dropOff, 1));

      const dropMat = new THREE.ShaderMaterial({
        uniforms: {
          uProgress: { value: 0 },
          uTime: { value: 0 },
        },
        vertexShader: `
          uniform float uProgress;
          uniform float uTime;
          attribute float aSize;
          attribute float aSpeed;
          attribute float aOffset;
          varying float vAlpha;
          void main() {
            vec3 pos = position;
            float clay = smoothstep(0.12, 0.22, uProgress) * (1.0 - smoothstep(0.48, 0.58, uProgress));
            float detach = smoothstep(0.28, 0.40, uProgress) * (1.0 - smoothstep(0.50, 0.62, uProgress));
            float t = uTime * aSpeed + aOffset;
            pos += normalize(pos) * (sin(t) * 0.18 * clay + detach * 0.35);
            vAlpha = max(clay, detach * 0.8);
            vec4 mv = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = aSize * (280.0 / -mv.z) * vAlpha;
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            float a = smoothstep(0.5, 0.0, d) * vAlpha;
            gl_FragColor = vec4(1.0, 1.0, 1.0, a * 0.75);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      const drops = new THREE.Points(dropGeo, dropMat);
      rig.add(drops);

      scene.add(new THREE.AmbientLight(0xffffff, 0.35));
      const key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(3, 5, 4);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xdde4ff, 0.45);
      fill.position.set(-4, 1, 2);
      scene.add(fill);

      function renderAt(time) {
        const p = Math.min(1, Math.max(0, time / DURATION));
        const t = time;

        const splitOut = smoothstep(0.32, 0.46, p);
        const drift = smoothstep(0.48, 0.62, p);
        const flatten = smoothstep(0.62, 0.82, p);
        const glide = smoothstep(0.82, 1.0, p);

        const coreOpacity = 1.0 - smoothstep(0.30, 0.42, p);
        coreMesh.visible = coreOpacity > 0.01;

        const splitOpacity = smoothstep(0.30, 0.42, p);
        leftMesh.visible = splitOpacity > 0.01;
        rightMesh.visible = splitOpacity > 0.01;

        let separation = splitOut * 0.55 + drift * 0.85 + glide * 2.8;
        const grow = 1.0 + glide * 0.3;
        const flatZ = Math.max(0.04, 1.0 - flatten * 0.96);

        leftMesh.position.set(-separation, 0, 0);
        rightMesh.position.set(separation, 0, 0);

        const baseScale = grow;
        coreMesh.scale.set(baseScale, baseScale, baseScale);
        leftMesh.scale.set(baseScale, baseScale, baseScale * flatZ);
        rightMesh.scale.set(baseScale, baseScale, baseScale * flatZ);

        const mats = [coreMat, leftMat, rightMat, dropMat];
        for (const m of mats) {
          if (m.uniforms.uProgress) m.uniforms.uProgress.value = p;
          if (m.uniforms.uTime) m.uniforms.uTime.value = t;
        }

        const wobble = smoothstep(0.08, 0.14, p) * (1 - smoothstep(0.28, 0.34, p));
        rig.rotation.z = Math.sin(t * 22.0) * 0.012 * wobble;

        renderer.render(scene, camera);
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#hf-driver", { x: 1920, duration: DURATION, ease: "none" }, 0);
      window.__timelines["main"] = tl;

      window.addEventListener("hf-seek", (event) => {
        const time = event.detail.time;
        tl.seek(time, false);
        renderAt(time);
      });

      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
