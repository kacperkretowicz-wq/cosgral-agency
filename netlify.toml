[build]
  publish = "designkopia/cosgral-agency"
  command = ""

# Netlify site: cosgral-agency-preview (NOT cosgralhub — to jest aplikacja CRM).
# Deploy: ./scripts/deploy-agency-preview.sh

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/portfolio/reels/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Biblioteki w /vendor sa przypiete wersjami (three 0.170.0, gsap 3.15.0,
# lenis 1.1.18) i nigdy nie zmieniaja tresci pod tym samym adresem — podmiana
# wersji to nowy plik przez ./scripts/vendor-libs.sh. Reguly wyzej nie mozna
# dziedziczyc, bo "no-cache" kazaloby przegladarce odpytywac o nie za kazdym
# wejsciem, mimo ze i tak dostanie 304.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
