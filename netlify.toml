[build]
  publish = "designkopia/cosgral-agency"
  command = ""

# Netlify site: cosgral-agency-preview (NOT cosgralhub — to jest aplikacja CRM).
# Deploy: ./scripts/deploy-agency-preview.sh

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Live chat API (Gemini Flash + proxy do Cosgral Hub)
# Env wymagane na Netlify: GEMINI_API_KEY
# Env opcjonalne: GEMINI_MODEL, CHAT_HUB_AGENT_PIN, COSGRAL_HUB_CHAT_API

[[redirects]]
  from = "/api/site-chat"
  to = "/.netlify/functions/site-chat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/portfolio/reels/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
